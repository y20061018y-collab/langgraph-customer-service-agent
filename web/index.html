<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业客服与工单 Agent · 演示</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1f2430; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2f6fed; --user: #2f6fed; --warn: #b45309; --warn-bg: #fef3c7;
    --ok: #166534; --ok-bg: #dcfce7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; max-width: 760px; margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; }
  header button { font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); text-align: center; margin-top: 24px; font-size: 14px; }
  .msg { max-width: 92%; }
  .msg.user { align-self: flex-end; }
  .bubble { padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 3px; }
  .bot .bubble { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
  .bot .bubble.error { color: #b91c1c; border-color: #fca5a5; }
  .bubble.md { white-space: normal; }
  .bubble.md p { margin: 0; }
  .bubble.md p + p, .bubble.md p + ul, .bubble.md p + ol, .bubble.md ul + p, .bubble.md ol + p { margin-top: 8px; }
  .bubble.md ul, .bubble.md ol { margin: 0; padding-left: 1.4em; }
  .bubble.md code { padding: 1px 5px; background: var(--bg); border-radius: 4px; font: 0.9em ui-monospace, Consolas, monospace; }
  details.trace { margin-top: 6px; font-size: 13px; color: var(--muted); }
  details.trace > summary { cursor: pointer; user-select: none; }
  .section { margin: 8px 0 0; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .section h3 { margin: 0 0 6px; font-size: 13px; color: var(--text); }
  .item + .item { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .name { font-weight: 600; color: var(--text); }
  pre { margin: 4px 0 0; padding: 6px 8px; background: var(--bg); border-radius: 6px; font: 12px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; word-break: break-all; color: var(--text); }
  .tag { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 12px; margin-left: 6px; }
  .tag.degraded { background: var(--warn-bg); color: var(--warn); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .none { font-size: 13px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; padding: 9px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>企业客服与工单 Agent</h1>
  <button type="button" id="reset">新会话</button>
</header>

<main id="log" aria-live="polite">
  <div class="empty" id="empty">在下方输入问题，例如查询订单、咨询售后政策。<br>每条回复下方可展开查看工具调用与检索片段。</div>
</main>

<form id="form">
  <input type="text" id="input" placeholder="输入你的问题…" autocomplete="off" required>
  <button type="submit" class="primary" id="send">发送</button>
</form>

<script>
(function () {
  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var empty = document.getElementById('empty');
  var sessionId = null;
  var SUMMARY_LEN = 200;

  // <markdown-render>
  // 极简 Markdown 渲染：先整体转义，再只识别 行内代码、**加粗**、有序/无序列表、换行。
  // 输出只会出现 p / br / strong / code / ul / ol / li 这几种标签（web/markdown.test.js 校验）。
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderMarkdown(text) {
    var codes = [];
    // 控制字符用作占位符，先从输入里去掉，防止被伪造
    var safe = escapeHtml(String(text).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ''));

    function inline(s) {
      // 行内代码先抽走，避免其中的 ** 被当作加粗
      s = s.replace(/`([^`\n]+)`/g, function (_, c) {
        codes.push('<code>' + c + '</code>');
        return '\u0001' + (codes.length - 1) + '\u0002';
      });
      // 只匹配成对且非空的 **...**；没有闭合的 ** 原样保留
      s = s.replace(/\*\*(?=\S)([^*\n]+?)\*\*/g, '<strong>$1</strong>');
      return s.replace(/\u0001(\d+)\u0002/g, function (_, i) { return codes[+i]; });
    }

    var out = [], para = [], list = null;
    function flushPara() {
      if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; }
    }
    function flushList() {
      if (list) {
        out.push('<' + list.type + '>' + list.items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</' + list.type + '>');
        list = null;
      }
    }

    safe.split(/\r?\n/).forEach(function (line) {
      var ul = /^\s*[-*]\s+(.*)$/.exec(line);
      var ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (ul || ol) {
        flushPara();
        var type = ul ? 'ul' : 'ol';
        if (list && list.type !== type) flushList();
        if (!list) list = { type: type, items: [] };
        list.items.push((ul || ol)[1]);
      } else if (!line.trim()) {
        flushPara(); flushList();
      } else {
        flushList();
        para.push(line);
      }
    });
    flushPara(); flushList();
    return out.join('');
  }
  // </markdown-render>

  var STATUS_TEXT = {
    hit: '命中',
    not_found: '未找到（全部低于相似度阈值）',
    kb_not_built: '知识库尚未建立',
    error: '检索失败'
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;   // 一律 textContent，避免注入
    return e;
  }

  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function addMessage(role, text, extraCls) {
    if (empty) { empty.remove(); empty = null; }
    var wrap = el('div', 'msg ' + role);
    wrap.appendChild(el('div', 'bubble' + (extraCls ? ' ' + extraCls : ''), text));
    log.appendChild(wrap);
    scrollDown();
    return wrap;
  }

  function summarize(text) {
    text = String(text);
    return text.length > SUMMARY_LEN ? text.slice(0, SUMMARY_LEN) + '…（共 ' + text.length + ' 字）' : text;
  }

  function renderTools(calls) {
    var box = el('div', 'section');
    box.appendChild(el('h3', null, '本轮调用的工具（' + calls.length + '）'));
    if (!calls.length) { box.appendChild(el('div', 'none', '本轮没有调用任何工具。')); return box; }
    calls.forEach(function (c) {
      var item = el('div', 'item');
      item.appendChild(el('div', 'name', c.tool_name));
      item.appendChild(el('pre', null, '参数：' + JSON.stringify(c.tool_input, null, 2)));
      item.appendChild(el('pre', null, '返回：' + summarize(c.tool_output)));
      box.appendChild(item);
    });
    return box;
  }

  function renderRetrievals(list) {
    var box = el('div', 'section');
    box.appendChild(el('h3', null, '检索到的知识库片段'));
    if (!list.length) { box.appendChild(el('div', 'none', '本轮没有检索知识库。')); return box; }
    list.forEach(function (r) {
      var item = el('div', 'item');
      var head = el('div');
      head.appendChild(el('span', 'name', '查询：' + r.query));
      head.appendChild(el('span', 'tag ' + (r.degraded ? 'degraded' : 'ok'),
        (STATUS_TEXT[r.status] || r.status) + (r.degraded ? ' · 已降级' : ' · 未降级')));
      item.appendChild(head);
      r.hits.forEach(function (h) {
        var line = el('div');
        line.appendChild(el('span', 'name', h.source));
        line.appendChild(el('span', null, '　相似度 ' + h.similarity.toFixed(2)));
        item.appendChild(line);
        item.appendChild(el('pre', null, summarize(h.snippet)));
      });
      box.appendChild(item);
    });
    return box;
  }

  function addTrace(wrap, data) {
    var d = el('details', 'trace');
    d.appendChild(el('summary', null, '查看执行详情'));
    d.appendChild(renderTools(data.tool_calls || []));
    d.appendChild(renderRetrievals(data.retrievals || []));
    wrap.appendChild(d);
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMessage('user', text);
    var pending = addMessage('bot', '思考中…');
    send.disabled = true;

    fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId })
    }).then(function (resp) {
      if (!resp.ok) throw new Error('服务返回 ' + resp.status);
      return resp.json();
    }).then(function (data) {
      sessionId = data.session_id;
      var bubble = pending.querySelector('.bubble');
      bubble.classList.add('md');
      bubble.innerHTML = renderMarkdown(data.reply);   // 已先转义，见 renderMarkdown
      addTrace(pending, data);
    }).catch(function (err) {
      var b = pending.querySelector('.bubble');
      b.textContent = '请求失败：' + err.message;
      b.classList.add('error');
    }).then(function () {
      send.disabled = false;
      input.focus();
      scrollDown();
    });
  });

  document.getElementById('reset').addEventListener('click', function () {
    sessionId = null;   // 不传 session_id，服务端会开新会话
    log.innerHTML = '';
    empty = el('div', 'empty', '已开始新会话。');
    log.appendChild(empty);
  });
})();
</script>
</body>
</html>
